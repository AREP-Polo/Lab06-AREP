<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Property Management System</h1>

        <div class="form-section">
            <h2>Add/Edit Property</h2>
            <form id="propertyForm">
                <input type="hidden" id="propertyId">
                <div class="form-group">
                    <label for="address">Address:</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-group">
                    <label for="price">Price:</label>
                    <input type="number" id="price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="size">Size (sq ft):</label>
                    <input type="number" id="size" required>
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" required></textarea>
                </div>
                <button type="submit" id="submitBtn">Add Property</button>
                <button type="button" id="cancelBtn" style="display:none;">Cancel</button>
            </form>
        </div>

        <div class="message" id="message"></div>

        <div id="loading" style="display:none;">Loading...</div>

        <div class="list-section">
            <h2>Properties List</h2>

            <div class="search-section">
                <div class="search-filters">
                    <input type="text" id="searchAddress" placeholder="Search by address...">
                    <input type="number" id="minPrice" placeholder="Min Price" step="0.01">
                    <input type="number" id="maxPrice" placeholder="Max Price" step="0.01">
                    <input type="number" id="minSize" placeholder="Min Size (sq ft)">
                    <input type="number" id="maxSize" placeholder="Max Size (sq ft)">
                    <button type="button" id="clearFilters">Clear Filters</button>
                </div>
            </div>

            <div class="pagination-info">
                <span id="resultsCount">0 properties found</span>
            </div>

            <div id="propertiesList"></div>

            <div class="pagination-controls">
                <button id="prevPage" disabled>Previous</button>
                <span id="pageInfo">Page 1 of 1</span>
                <button id="nextPage" disabled>Next</button>
                <select id="pageSize">
                    <option value="5">5 per page</option>
                    <option value="10" selected>10 per page</option>
                    <option value="20">20 per page</option>
                </select>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
